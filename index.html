  <script>
    (() => {
      if (window.flashcardAssets || navigator.connection?.saveData || !window.fetch || !window.AbortController ||
          !window.TextDecoder || !URL.createObjectURL) return;
      const themes = ['textbook', 'comic', 'cute', 'maruko', 'pig', 'shin', 'pixel'];
      const requested = new URLSearchParams(location.search).get('style');
      let saved;
      try { saved = JSON.parse(localStorage.getItem('shanghai-flashcards-v2'))?.style; } catch {}
      const theme = themes.includes(requested) ? requested : themes.includes(saved) ? saved : 'textbook';
      const controller = new AbortController();
      const response = fetch('assets/navigation-readable/' + theme + '.bin', {
        priority: 'low', signal: controller.signal
      }).catch(() => null);
      window.navigationReadablePreload = {theme, controller, response};
    })();
  </script>
