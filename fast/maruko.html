  <style>
:root {
  color-scheme: light;
  --paper: #faf8f0;
  --ink: #1e263d;
  --muted: #61667a;
  --line: #dededc;
  --blue: #334baa;
  --lime: #e8f48c;
  font-family: "Aptos", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
button, select { font: inherit; color: inherit; }
a { color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid #526ae0; outline-offset: 3px; }
.wrap { width: min(1160px, calc(100% - 72px)); margin-inline: auto; }
.top { border-bottom: 1px solid #e9e6db; background: #fffdf6; }
.top-inner { display: flex; justify-content: space-between; align-items: center; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 900; font-size: 17px; line-height: 1.2; }
.brand-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--blue); color: white; transform: rotate(-7deg); font-size: 20px; font-weight: 900; }
.brand small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; letter-spacing: .17em; }
.grade { border: 1px solid #e5e1d1; border-radius: 100px; padding: 8px 13px; font-size: 12px; font-weight: 700; }
.hero { position: relative; display: flex; align-items: center; min-height: 112px; overflow: hidden; margin-block: 16px; border: 1px solid #273982; border-radius: 19px; background: #394fae; color: #fff; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, #ffffff3d 1px, transparent 1.3px) 0 0 / 15px 15px; mask-image: linear-gradient(90deg, transparent 28%, #000 88%); pointer-events: none; }
.hero-copy { z-index: 1; padding: 15px 26px; }
h1 { font-size: clamp(34px, 4.6vw, 48px); letter-spacing: -.06em; margin: 0; line-height: 1.09; font-weight: 950; }
h1 span { color: #ebf783; }
.intro { margin: 8px 0 0; color: #f0f1ff; font-size: 14px; font-weight: 650; }
.hero-art { position: absolute; inset: 0 4% 0 auto; width: 245px; }
.orbit { position: absolute; inset: 20% -8% 21% 0; border: 1px dashed #dbe5fcaa; border-radius: 50%; transform: rotate(-18deg); }
.deco-tile { position: absolute; display: grid; place-items: center; border-radius: 24%; border: 2px solid #20294c; box-shadow: 4px 6px #1d2a6c; }
.deco-tile img { width: 75%; height: 75%; object-fit: contain; pointer-events: none; }
.tile-book { width: 61px; height: 59px; left: 8%; top: 24%; background: #ffd2e0; transform: rotate(-16deg); }
.tile-pencil { width: 50px; height: 48px; right: 9%; top: 19%; background: #fef2b0; transform: rotate(17deg); }
.tile-bag { width: 73px; height: 70px; left: 37%; top: 22%; background: #e4f381; transform: rotate(-8deg); }
.hero-spark { position: absolute; color: #ebf783; z-index: 1; font-size: 22px; }
.spark-a { top: 6%; left: 31%; }.spark-b { bottom: 10%; right: 4%; }
.learn { display: grid; grid-template-columns: 222px minmax(0, 1fr); gap: 25px; align-items: start; }
.rail { border: 1px solid var(--line); border-radius: 19px; background: #fffdf8; padding: 16px 11px 12px; }
.rail h2 { font-size: 14px; margin: 1px 9px 12px; }
.rail nav { display: grid; gap: 3px; }
.unit { display: flex; align-items: center; width: 100%; min-height: 42px; padding: 6px 8px; gap: 9px; border: 1px solid transparent; border-radius: 11px; background: transparent; text-align: left; }
.unit:hover { background: #f3f3fb; }
.unit[aria-current] { border-color: #c7d0ff; background: #e8edff; color: #29429c; }
.unit-icon { object-fit: contain; flex: 0 0 auto; width: 24px; height: 24px; }
.unit-name { font-size: 13px; font-weight: 750; }
.unit-tag { margin-left: auto; font-size: 10px; white-space: nowrap; color: var(--muted); font-weight: 700; }
.mobile-lessons { display: none; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 13px; background: #fffdf8; border: 1px solid var(--line); border-radius: 16px; }
.setting { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 750; white-space: nowrap; }
.setting-label {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.style-setting select { min-width: 115px; flex: 1; min-height: 40px; border: 1px solid #dce1f6; border-radius: 9px; padding: 5px 10px; background: #edf0ff; font-size: 14px; }
.segmented { display: flex; gap: 3px; padding: 3px; border-radius: 10px; background: #eeeee9; }
.segmented button { min-height: 33px; min-width: 58px; border: 0; border-radius: 8px; padding: 4px 10px; background: transparent; white-space: nowrap; font-size: 13px; font-weight: 750; }
.segmented button[aria-pressed="true"] { background: var(--ink); color: white; }
.segmented b { font-size: 10px; letter-spacing: .035em; opacity: .8; }
.lesson-header { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin-block: 15px 12px; }
.lesson-kicker { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
#lesson-number { padding: 3px 8px; border-radius: 6px; color: #334591; background: #e8edff; }
.lesson-header h2 { margin: 5px 0 3px; font-size: clamp(24px, 4vw, 32px); line-height: 1.13; font-weight: 950; scroll-margin-block-start: 16px; }
#lesson-english { margin: 0; color: var(--muted); font-size: 15px; font-weight: 650; }
.recall, .lesson-bottom button { border: 1px solid #deded7; border-radius: 11px; min-height: 42px; background: #fffdf8; font-size: 13px; font-weight: 750; padding: 8px 12px; white-space: nowrap; }
.recall[aria-pressed="true"] { border-color: #c3d27b; background: #f0f7c1; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
.focus-stage {
  position: relative;
  padding: 14px 18px 9px;
  border: 1px solid #d8ddf4;
  border-radius: 23px;
  background: radial-gradient(ellipse at 50% 36%, #fbfbff, #e9edfc);
}
.cards.focus {
  position: relative;
  display: flex;
  gap: 14px;
  width: 100%;
  max-width: 610px;
  margin-inline: auto;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  border-radius: 19px;
  box-shadow: 0 5px 18px #2f3b6524;
}
.cards.focus::-webkit-scrollbar { display: none; }
.cards.focus .card { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; border-color: #c2cae6; }
.cards.focus .card:focus-visible { outline-offset: -3px; }
.cards.focus .card-art { aspect-ratio: 1.59; max-height: 310px; max-height: clamp(180px, 36svh, 310px); }
.cards.focus .card.portrait-art .card-art, .cards.focus.portrait-cards .card-art { flex: 0 0 auto; aspect-ratio: 3 / 4; max-height: none; }
.cards.focus .card-copy { min-height: 102px; padding: 12px 91px 14px; text-align: center; }
.cards.focus .word { font-size: clamp(28px, 6.1vw, 46px); }
.cards.focus .meaning { font-size: 16px; }
.cards.focus .speaker {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  top: 13px;
  right: 12px;
  width: 74px;
  height: 39px;
  border-radius: 20px;
  background: #e7edff;
}
.cards.focus .speaker svg { width: 19px; height: 19px; }
.speaker-label { display: none; }
.cards.focus .speaker-label { display: inline; font-size: 11px; font-weight: 800; white-space: nowrap; }
.card-nav[hidden] { display: none; }
.card-nav { display: flex; justify-content: center; align-items: center; gap: 22px; margin: 10px auto 0; }
.card-nav button { border: 1px solid #c4cdf0; border-radius: 13px; width: 46px; height: 45px; padding: 0; background: #fff; color: var(--blue); font-size: 29px; line-height: 1; }
@media (hover: hover) { .card-nav button:not(:disabled):hover { background: #dbe4fd; border-color: #a7b4e3; } }
.card-nav button:disabled { opacity: .36; cursor: default; }
.card-position { display: grid; min-width: 94px; gap: 3px; text-align: center; font-size: 15px; font-weight: 800; }
.swipe-hint { color: var(--muted); font-size: 11px; font-weight: 650; }
.card { position: relative; display: flex; flex-direction: column; min-width: 0; margin: 0; overflow: hidden; border-radius: 18px; padding: 0; border: 1px solid #dfded7; text-align: left; background: #fff; transition: transform .16s, box-shadow .16s, border-color .16s; }
@media (hover: hover) { .card:hover { transform: translateY(-3px); box-shadow: 0 7px 14px #322e4a19; border-color: #919ed3; } }
.cards.focus .card:hover, .cards.focus .card:active { transform: none; box-shadow: none; }
.cards.focus .card.playing { box-shadow: inset 0 0 0 2px #7f93ee70; }
.card:active { transform: scale(.985); }
.card.playing { border-color: var(--blue); box-shadow: 0 0 0 2px #7f93ee70; }
.card-art {
  position: relative;
  width: 100%;
  aspect-ratio: 1.52;
  min-height: 103px;
  overflow: hidden;
  background: #edf1e7;
}
.scene-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}
.cards .card[data-image-state="loading"] .card-art::after,
.cards .card[data-image-state="error"] .card-art::after {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 14px;
  content: "正在加载图片…";
}
.cards .card[data-image-state="loading"] .scene-art,
.cards .card[data-image-state="error"] .scene-art { visibility: hidden; }
.cards.focus .card[data-image-state="switching"] .card-art::after,
.cards.focus .card[data-image-state="preview-only"] .card-art::after {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 4px 8px;
  border-radius: 9px;
  color: var(--muted);
  background: #fffffff0;
  font-size: 12px;
  content: "正在切换图片…";
  animation: show-image-switch 150ms step-end both;
}
.cards.focus .card[data-image-state="preview-only"] .card-art::after { content: "暂显示缩略图"; }
@keyframes show-image-switch { from { opacity: 0; } to { opacity: 1; } }
.counting-lesson .cards.focus .card[data-image-state]:not([data-image-state="switching"]) .card-art { min-height: 140px; }
.cards .card[data-image-state="error"] .card-art::after { content: "图片暂未加载"; }
.scene-art[data-scene-style="pixel"] { image-rendering: pixelated; }
.card-copy { position: relative; width: 100%; min-height: 88px; padding: 13px 50px 12px 13px; }
.word { display: block; font: 850 clamp(17px, 2.2vw, 24px)/1.16 "Aptos", "Arial Rounded MT Bold", system-ui, sans-serif; letter-spacing: -.025em; overflow-wrap: anywhere; }
.meaning { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.cards.masked .meaning { visibility: hidden; }
.speaker { position: absolute; display: grid; place-items: center; inset: 12px 10px auto auto; width: 33px; height: 33px; border-radius: 50%; color: #3752b0; background: #edf0fe; }
.speaker svg { width: 18px; height: 18px; }
.playing .speaker { color: white; background: var(--blue); }
.cards.focus .playing .speaker { color: white; background: var(--blue); }
.audio-status { padding: 10px 12px; border-radius: 10px; background: #ffefc7; color: #4c381b; font-size: 13px; }
.lesson-bottom { display: flex; justify-content: space-between; gap: 10px; margin-top: 17px; }
.lesson-bottom button:disabled { visibility: hidden; }
footer { border-top: 1px solid #e5e2d8; margin-top: 30px; padding: 17px 0 max(18px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 9px; color: var(--muted); font-size: 12px; }
footer a { text-underline-offset: 3px; }
@media (max-width: 900px) {
  .wrap { width: calc(100% - 40px); }
  .learn { grid-template-columns: 173px minmax(0, 1fr); gap: 15px; }
  .unit { padding-inline: 5px; gap: 5px; }
  .unit-icon { width: 19px; height: 19px; }
  .unit-name { font-size: 12px; }
}
@media (max-width: 850px) {
  .toolbar {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: stretch;
    gap: 7px;
    padding: 6px 7px;
    border-radius: 13px;
  }
  .setting { min-width: 0; }
  .style-setting select {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 3px 4px;
    text-align: center;
    font-size: 16px;
  }
  .segmented { gap: 2px; padding: 2px; }
  .segmented button { min-width: 36px; min-height: 40px; padding: 3px 4px; font-size: 12px; }
  .segmented b { display: none; }
}
@media (max-width: 690px) {
  .wrap { width: calc(100% - 20px); }
  .top-inner { min-height: 46px; }
  .brand { font-size: 15px; gap: 8px; }
  .brand-icon { width: 30px; height: 30px; border-radius: 9px; font-size: 17px; }
  .brand small { display: none; }
  .grade { padding: 0; border: 0; color: var(--muted); font-size: 12px; }
  .hero {
    position: absolute;
    width: 1px;
    height: 1px;
    min-height: 0;
    margin: -1px;
    border: 0;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .hero-art { display: none; }
  .learn {
    --control-height: 44px;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 7px;
    margin-top: 8px;
  }
  .learn.single-card:not(.counting-lesson) {
    --mobile-header: 55px; /* 46px header, 1px border, and 8px gap. */
    min-height: calc(100vh - var(--mobile-header));
    min-height: calc(100svh - var(--mobile-header));
    grid-template-rows: auto auto minmax(min-content, 1fr);
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .study { display: contents; }
  .rail { grid-column: 1; grid-row: 1; padding: 0; border: 0; background: none; }
  .rail h2, .rail nav { display: none; }
  .mobile-lessons, .mobile-lessons summary, .style-setting { position: relative; }
  .mobile-lessons { display: block; }
  .mobile-lessons[open] { z-index: 5; }
  .mobile-lessons summary, .style-setting select, .recall {
    -webkit-appearance: none;
    appearance: none;
    height: var(--control-height);
    min-height: var(--control-height);
    margin: 0;
    line-height: 1.25;
  }
  .mobile-lessons summary, .style-setting select {
    width: 100%;
    border-radius: 11px;
    font-size: 16px;
  }
  .mobile-lessons summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 29px 0 9px;
    border: 1px solid #dededc;
    background: #fffdf8;
    list-style: none;
    font-weight: 750;
    cursor: pointer;
  }
  .mobile-lessons summary::-webkit-details-marker { display: none; }
  .mobile-lessons summary:focus-visible { outline: 3px solid #526ae0; outline-offset: 3px; }
  #lesson-current { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .mobile-lessons .unit-icon { width: 26px; height: 26px; }
  .lesson-options {
    position: absolute;
    top: calc(100% + 6px);
    inset-inline: 0;
    max-height: min(55vh, 370px);
    max-height: min(55svh, 370px);
    overflow-y: auto;
    overscroll-behavior-y: contain;
    padding: 5px;
    border: 1px solid #dededc;
    border-radius: 13px;
    background: #fffdf8;
    box-shadow: 0 8px 24px #22316a26;
  }
  .lesson-options .unit { min-height: 44px; gap: 7px; }
  .lesson-options .unit-name { font-size: 14px; }
  .lesson-options .unit-tag { font-size: 11px; }
  .style-setting select { display: block; padding: 0 23px; }
  .mobile-lessons summary::after, .style-setting::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 12px;
    width: 8px;
    height: 8px;
    border: solid #425174;
    border-width: 0 2px 2px 0;
    transform: translateY(-68%) rotate(45deg);
    pointer-events: none;
  }
  .mobile-lessons[open] summary::after { transform: translateY(-28%) rotate(225deg); }
  .lesson-header { grid-column: 2; grid-row: 1; display: block; margin: 0; }
  .lesson-header > div { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .recall { display: flex; align-items: center; justify-content: center; padding: 0 11px; }
  .toolbar { grid-column: 1 / -1; grid-row: 2; padding: 0; border: 0; background: none; }
  .toolbar .segmented button { min-width: 42px; font-size: 13px; }

  .deck-stage { grid-column: 1 / -1; grid-row: 3; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .card { border-radius: 13px; }
  .card-copy { min-height: 78px; padding: 10px 32px 9px 9px; }
  .speaker { width: 25px; height: 25px; right: 5px; top: 9px; }
  .speaker svg { width: 15px; height: 15px; }
  .meaning { font-size: 12px; }
  .focus-stage {
    align-self: stretch;
    display: grid;
    grid-template-rows: minmax(min-content, 1fr) auto;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
  }
  .cards.focus { border-radius: 19px; box-shadow: 0 5px 14px #22316a15; }
  .cards.focus .card { border-color: #d9def1; border-radius: 19px; }
  .cards.focus .card-art {
    flex: 1 0 auto;
    aspect-ratio: 4 / 3;
    min-height: 0;
    max-height: none;
  }
  .cards.focus .card.portrait-art .card-art { flex: 0 0 auto; aspect-ratio: 3 / 4; max-height: none; }
  .scene-art { object-fit: cover; }
  .cards.focus .scene-art { object-fit: contain; }
  /* Counting cards need their full width so every object stays visible. */
  .counting-lesson .cards:not(.portrait-cards) .card-art { flex: 0 0 auto; aspect-ratio: auto; min-height: 0; }
  .counting-lesson .cards.focus:not(.portrait-cards) .card.portrait-art .card-art { aspect-ratio: auto; }
  .counting-lesson .cards:not(.portrait-cards) .scene-art {
    position: static;
    display: block;
    height: auto;
    aspect-ratio: auto 4 / 3;
  }
  .cards.focus .card-copy {
    display: grid;
    align-content: center;
    flex: 0 0 auto;
    min-height: 100px;
    min-height: clamp(100px, 17svh, 126px);
    padding: 14px 72px;
  }
  .learn:not(.counting-lesson) .cards.focus .card-copy {
    min-height: clamp(100px, 19svh, 174px);
  }
  .cards.focus .word { font-size: clamp(29px, 9.4vw, 44px); }
  .cards.focus .meaning { font-size: 18px; margin-top: 4px; }
  .cards.focus .speaker {
    top: 50%;
    right: 10px;
    width: 56px;
    height: 50px;
    flex-direction: column;
    gap: 1px;
    border-radius: 13px;
    transform: translateY(-50%);
  }
  .card-nav { display: grid; grid-template-columns: 46px 1fr 46px; gap: 10px; margin: 8px 0 0; }
  .card-position { gap: 2px; }
  .swipe-hint { font-size: 12px; }
  .audio-status { grid-column: 1 / -1; margin: 0; }
  .lesson-bottom, footer { display: none; }
}
@media (max-width: 360px) {
  .toolbar { gap: 4px; }
  .toolbar .segmented button { min-width: 36px; padding-inline: 3px; font-size: 12px; }
}
@media (min-width: 980px) {
  .focus-stage { padding-inline: 66px; }
  .card-nav button { position: absolute; top: calc(50% - 34px); }
  #previous-card { left: 11px; }
  #next-card { right: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

body.fast-loading > main { display: none; }
#fast-loading { padding: 14px 0; }
</style>

    if (/^assets\/scenes-card-(?:lite|webp)\/cute\//.test(path)) return path + '?v=5';
    const revised = /^assets\/scenes-card(?:-lite|-webp)\//.test(path) || path.startsWith('assets/scenes-card/cute/') ||
      /^assets\/scenes-card(?:-lite|-webp)?\/pig\//.test(path);
    return revised ? path + '?v=4' : path;

  function hasFullBundle(imageStyle) {
    return imageStyle === bundledStyle && (!deferredBundle || window.flashcardBundleReady);
  }

  function prepareFullBundle() {
    if (!deferredBundle || style !== bundledStyle || hasFullBundle(style) || bundleLoading ||
        !navigator.onLine || navigator.connection?.saveData) return;
    bundleLoading = true;
    setTimeout(() => {
      if (style !== bundledStyle) {
        bundleLoading = false;
        return;
      }
      const script = make('script');
      script.fetchPriority = 'low';
      script.src = deferredBundle;
      const cleanup = () => {
        bundleLoading = false;
        script.remove();
      };
      script.onerror = cleanup;
      script.onload = () => {
        cleanup();
        if (style !== bundledStyle || !hasFullBundle(style) || !artworkRequest) return;
        const activeImages = view === 'focus' ? [artworkRequest.images[cardIndex]] : artworkRequest.images;
        const pending = activeImages.filter((node) => !decodedScenes.has(node));
        if (!pending.length) return;
        // Replace any stalled requests with the now-local images.
        artworkRequest = undefined;
        pending.forEach((node) => sceneLoads.get(node)?.cancel());
        visibleArt();
      };
      document.head.append(script);
    }, 1200);
  }

  function wordKey(word) {
    return word.toLowerCase().replace(/[^a-z ]/g, '').trim().replace(/ +/g, '-');
  }

  function image(key, className, kind) {
    const node = make('img', className);
    node.alt = '';
    node.decoding = 'async';
    node.dataset.image = key;
    if (kind) node.dataset.artKind = kind;
    return node;
  }

  function cardAssetPaths(scenePath) {
    const webp = window.hdSceneAssetPaths?.[scenePath];
    if (!webp) return [];
    if (window.flashcardAssets?.[webp] || (window.flashcardAssets && !bundledStyle)) return [webp];
    const lighterWebp = webp.replace('scenes-card/', 'scenes-card-webp/');
    if (!compactCards) return [lighterWebp];
    const avif = webp.replace('scenes-card/', 'scenes-card-lite/').replace(/\.webp$/, '.avif');
    return [avif, lighterWebp];
  }

  function usesPortraitArt(node) {
    return node?.dataset.sceneView === 'focus' && portraitLayout;
  }

  function applyArt(node, onFailure, packedSource) {
    const isScene = node.dataset.artKind === 'scene';
    const key = node.dataset.image || node.dataset.heroArt;
    const imageStyle = node.dataset.sceneStyle || style;
    const directory = isScene ? 'scenes/' + imageStyle : imageStyle;
    const path = 'assets/' + directory + '/' + key + '.webp';
    const standardPath = window.sceneAssetPaths?.[path] || path;
    const sources = isScene && node.dataset.sceneView === 'focus' ? cardAssetPaths(path) : [];
    if (packedSource) sources.unshift(packedSource);
    const portraitOnly = usesPortraitArt(node);
    if (!portraitOnly) sources.push(standardPath);
    const sourcePath = sources[0];
    if (!sourcePath) {
      onFailure?.();
      return;
    }
    if (node.dataset.appliedStyle === imageStyle && node.dataset.appliedPath === sourcePath) return;
    let attempt = 0;
    node.onerror = () => {
      const fallback = sources[++attempt];
      if (fallback) {
        node.src = assetUrl(fallback);
        return;
      }
      if (portraitOnly) {
        if (attempt === sources.length) {
          // A separate cache key lets the portrait recover from a stale or failed response.
          const url = assetUrl(sources[sources.length - 1]);
          node.src = url + (url.includes('?') ? '&' : '?') + 'retry=1';
          return;
        }
        node.onerror = null;
        onFailure?.();
        return;
      }
      const fallbackKey = isScene
        ? window.lessons.flatMap((lesson) => lesson[5]).find((word) => wordKey(word[0]) === key)?.[2].split(' ')[0]
        : key;
      node.onerror = null;
      if (fallbackKey) {
        node.onerror = () => {
          node.onerror = null;
          onFailure?.();
        };
        node.src = assetUrl('assets/' + imageStyle + '/' + fallbackKey + '.webp');
      } else {
        onFailure?.();
      }
    };
    node.src = assetUrl(sourcePath);
    node.dataset.appliedStyle = imageStyle;
    node.dataset.appliedPath = sourcePath;
  }

  function clearPlaying() {

  function stop() {

  function speak(card, word) {
    stop();
    const current = playback;
    const filename = wordKey(word);
    const onFailure = () => {
      if (current !== playback) return;
      clearPlaying();
      status.textContent = '发音没加载成功，请检查网络后再点一次。';
      status.hidden = false;
    };
    activeCard = card;
    card.classList.add('playing');
    voice.onended = () => {
      if (current === playback) clearPlaying();
    };
    voice.onerror = onFailure;
    voice.src = assetUrl('assets/audio/' + accent + '/' + filename + '.mp3');
    // Keep play() in the tap handler so WeChat and Safari accept the gesture.
    const result = voice.play();
    if (result && result.catch) result.catch(onFailure);

      ? focusedStyleWarm.images.get(imageStyle) : null;
    const node = images.get(key) || preloaded || makeScene(word, mode, imageStyle);

    images.set(key, node);
    const sameView = [...images.keys()].filter((cached) => cached.startsWith(mode + ':'));

  function loadScene(node, priority, packedImage, preferPack = false, directPortrait = false) {
    const pending = sceneLoads.get(node);
    if (decodedScenes.has(node)) return pending.promise;

    if (pending) {

        pending.tryOtherPortrait?.();

    const request = {};
    sceneLoads.set(node, request);
    request.promise = new Promise((resolve) => {
      let settled = false;
      let started = false;
      let packPending = Boolean(packedImage);
      let directFailed = false;
      let fallbackTimer;

        clearTimeout(fallbackTimer);
        clearTimeout(portraitTimer);

      const ready = async () => {
        const source = node.src;
        try { await node.decode(); } catch { /* A loaded image can still be displayed. */ }
        if (settled) return;
        if (node.src !== source) {
          node.addEventListener('load', ready, {once: true});
          return;
        }
        if (node.naturalWidth && usesPortraitArt(node) && node.naturalWidth * 4 !== node.naturalHeight * 3) {
          node.addEventListener('load', ready, {once: true});
          node.onerror();
          return;
        }
        finish(node.naturalWidth > 0);
      };
      request.cancel = () => {
        if (settled) return;
        node.onerror = null;
        node.removeAttribute('src');
        finish(false);
      };
      request.tryOtherPortrait = () => {
        if (portraitTimer || !usesPortraitArt(node) || !compactCards || navigator.connection?.saveData ||
            navigationPreview?.style !== node.dataset.sceneStyle) return;
        const first = node.src;
        if (!/\.avif(?:\?|$)/.test(first)) return;
        const stillWaiting = () => !settled && node.src === first && !(node.complete && node.naturalWidth);
        portraitTimer = setTimeout(() => {
          if (!stillWaiting()) return;
          const path = 'assets/scenes/' + node.dataset.sceneStyle + '/' + node.dataset.image + '.webp';
          const [, webp] = cardAssetPaths(path);
          if (!webp) return;
          // Keep the original request in flight and use the other format only if it arrives first.
          otherPortrait = new Image();
          otherPortrait.onload = () => {
            if (stillWaiting() && otherPortrait.naturalWidth * 4 === otherPortrait.naturalHeight * 3) {
              node.src = otherPortrait.src;
            }
          };
          otherPortrait.src = assetUrl(webp);
        }, 550);
      };
      const load = (source) => {
        if (settled) return;
        started = true;
        node.addEventListener('load', ready, {once: true});
        applyArt(node, () => {
          if (packPending) directFailed = true;
          else finish(false);
        }, source);
      };
      if (packedImage) {
        if (preferPack && usesPortraitArt(node) && !navigator.connection?.saveData) {
          // On promotion, give the pack a head start before requesting just the visible portrait.
          request.prioritizePortrait = () => {
            if (settled || started || !packPending || fallbackTimer) return;
            fallbackTimer = setTimeout(load, 450);
          };
          if (priority === 'high') {
            if (directPortrait) load();
            else request.prioritizePortrait();
          }
        }
        if (priority !== 'low' && !preferPack) fallbackTimer = setTimeout(load, priority === 'high' ? 180 : 360);
        packedImage.then((source) => {
          packPending = false;
          clearTimeout(fallbackTimer);
          if (!started || (source && !(node.complete && node.naturalWidth))) load(source);
          else if (directFailed) finish(false);
        });
      } else {
        load();
        if (priority === 'high') request.tryOtherPortrait();
      }
    });
    return request.promise;
  }

  function watchPackProgress(pack) {
    clearTimeout(pack.stallTimer);
    pack.stallTimer = setTimeout(() => pack.controller.abort(), pack.idleTimeout || 2500);
  }

  async function readArtworkPack(response, pack) {
    const stream = response.body?.getReader?.();
    let chunk = stream ? new Uint8Array() : new Uint8Array(await response.arrayBuffer());
    async function take(size) {
      const bytes = new Uint8Array(size);
      for (let offset = 0; offset < size;) {
        if (!chunk.length) {
          const next = stream && await stream.read();
          if (!next || next.done) throw new Error('Incomplete artwork pack');
          chunk = next.value;
          watchPackProgress(pack);
        }
        const count = Math.min(size - offset, chunk.length);
        bytes.set(chunk.subarray(0, count), offset);
        chunk = chunk.subarray(count);
        offset += count;
      }
      return bytes;
    }
    try {
      const header = new DataView((await take(4)).buffer);
      const tableSize = header.getUint32(0, true);
      if (!tableSize || tableSize > 4096) throw new Error('Invalid artwork index');
      const files = JSON.parse(new TextDecoder().decode(await take(tableSize)));
      if (files.length !== pack.words.length || files.some((file, index) => file.word !== pack.words[index])) {
        throw new Error('Wrong lesson artwork');
      }
      for (const [index, {size}] of files.entries()) {
        if (!Number.isInteger(size) || size <= 0 || size > 200000) throw new Error('Invalid artwork size');
        const bytes = await take(size);
        if (pack.controller.signal.aborted) return;
        const url = URL.createObjectURL(new Blob([bytes], {type: 'image/' + pack.format}));
        pack.urls.push(url);
        pack.ownerUrls?.add(url);
        pack.resolve[index](url);
      }
      if (stream) await stream.read();
    } finally {
      if (stream) stream.cancel().catch(() => {});
    }
  }

  function artworkPackFor(lesson, imageStyle, priority, mode = 'grid') {
    if (hasFullBundle(imageStyle) || (window.flashcardAssets && !bundledStyle) ||
        !window.fetch || !window.AbortController || !window.TextDecoder || !URL.createObjectURL) return;
    const active = lesson.index === lessonIndex && imageStyle === style;
    const key = bundledStyle ? mode + ':' + imageStyle : imageStyle;
    const existing = lesson.packs.get(key);
    if (existing) {
      if (active) existing.active = true;
      return existing;
    }
    const format = !bundledStyle && compactCards ? 'avif' : 'webp';
    const pack = {lesson, key, imageStyle, format, active, controller: new AbortController(), urls: [], ownerUrls: lesson.urls, resolve: []};
    pack.words = lesson.deck.map((card) => cardScenes.get(card).word);
    pack.images = pack.words.map(() => new Promise((resolve) => pack.resolve.push(resolve)));
    lesson.packs.set(key, pack);
    const directory = bundledStyle ? 'fast-lesson-packs' : 'scenes-grid-packs';
    const suffix = bundledStyle ? '.' + mode : '';
    const path = 'assets/' + directory + '/' + imageStyle + '/' + lesson.index + suffix + '.' + pack.format + '.bin';
    watchPackProgress(pack);
    pack.done = fetch(assetUrl(path), {priority, signal: pack.controller.signal})
      .then(async (response) => {
        if (!response.ok) return false;
        await readArtworkPack(response, pack);
        return !pack.controller.signal.aborted;
      })
      .catch(() => false)
      .then((complete) => {
        if (!complete && lesson.packs.get(key) === pack) lesson.packs.delete(key);
      })
      .finally(() => {
        clearTimeout(pack.stallTimer);
        pack.finished = true;
        pack.resolve.forEach((resolve) => resolve(null));
      });
    return pack;
  }

  function discardArtworkPack(pack, keepUrls = false) {
    if (pack.lesson.packs.get(pack.key) === pack) pack.lesson.packs.delete(pack.key);
    pack.controller.abort();
    if (!keepUrls) pack.urls.forEach((url) => {
      URL.revokeObjectURL(url);
      pack.lesson.urls.delete(url);
    });
  }

  function prepareStylePortraits(imageStyle) {
    if (!bundledStyle || imageStyle === bundledStyle || stylePortraitPacks.has(imageStyle) ||
        navigator.connection?.saveData || !navigator.onLine || !window.fetch || !window.AbortController ||
        !window.TextDecoder || !URL.createObjectURL) return;
    const pack = {controller: new AbortController(), format: 'webp', urls: [], words: portraitWords, resolve: [], available: new Map()};
    pack.images = new Map(portraitWords.map((word) => [word, new Promise((resolve) => {
      pack.resolve.push((url) => {
        if (url) pack.available.set(word, url);
        resolve(url);
      });
    })]));
    stylePortraitPacks.set(imageStyle, pack);
    watchPackProgress(pack);
    fetch(assetUrl('assets/fast-style-portraits/' + imageStyle + '.webp.bin'), {
      priority: 'low', signal: pack.controller.signal
    }).then(async (response) => {
      if (response.ok) await readArtworkPack(response, pack);
    }).catch(() => {}).finally(() => {
      clearTimeout(pack.stallTimer);
      pack.resolve.forEach((resolve) => resolve(null));
      if (!pack.available.size) stylePortraitPacks.delete(imageStyle);
    });
  }

  function firstImageSource(primary, alternate) {
    if (!primary || !alternate) return primary || alternate;
    return new Promise((resolve) => {
      let missing = 0;
      const accept = (url) => {
        if (url || ++missing === 2) resolve(url);
      };
      primary.then(accept);
      alternate.then(accept);
    });
  }

  function loadCardScene(lesson, card, node, priority, directPortrait = false) {
    const {sceneStyle, sceneView} = node.dataset;
    const {index, word} = cardScenes.get(card);
    const directory = sceneView === 'focus' ? 'scenes-card' : 'scenes';
    const embedded = window.flashcardAssets?.['assets/' + directory + '/' + sceneStyle + '/' + word + '.webp'];
    const portraits = sceneView === 'focus' && !embedded && !sceneLoads.has(node) && stylePortraitPacks.get(sceneStyle);
    const cachedPortrait = portraits && portraits.available.get(word);
    if (cachedPortrait) return loadScene(node, priority, Promise.resolve(cachedPortrait), true);
    const packedImage = (bundledStyle || sceneView === 'grid') && !embedded && !sceneLoads.has(node)
      ? artworkPackFor(lesson, sceneStyle, priority, sceneView)?.images[index] : null;
    return loadScene(node, priority, firstImageSource(packedImage, portraits && portraits.images.get(word)),
      Boolean(bundledStyle), directPortrait);
  }

  function stopSpeculation(nextStyle) {
    if (!speculativeStyle || speculativeStyle.style === nextStyle) return;
    speculativeStyle.controller.abort();
    const {pack} = speculativeStyle;
    if (pack && !pack.active && !pack.finished) discardArtworkPack(pack);
    speculativeStyle = undefined;
  }

  function releaseFocusedStyles(keepDecoded = false) {
    if (!focusedStyleWarm) return;
    const {card, images} = focusedStyleWarm;
    const used = cardScenes.get(card).images;
    for (const [imageStyle, node] of images) {
      if (keepDecoded && decodedScenes.has(node)) continue;
      if (used.get('focus:' + imageStyle) !== node) sceneLoads.get(node)?.cancel();
      images.delete(imageStyle);
    }
    if (!keepDecoded) focusedStyleWarm = undefined;
  }

  function prewarmFocusedStyles(request) {
    if (artworkRequest !== request || request.mode !== 'focus' || window.flashcardAssets ||
        navigator.connection?.saveData) return;
    const card = request.deck[cardIndex];
    if (focusedStyleWarm?.card !== card) {
      releaseFocusedStyles();
      focusedStyleWarm = {card, images: new Map()};
    }
    const warm = focusedStyleWarm;
    if (warm.request === request) return warm.promise;
    warm.request = request;
    const {word, images} = cardScenes.get(card);
    const start = styles.indexOf(request.style);
    const remaining = styles.slice(start + 1).concat(styles.slice(0, start));
    // Warm the lightweight illustrations first so they are ready even on a slow link.
    const pig = remaining.indexOf('pig');
    if (pig > 0) remaining.unshift(remaining.splice(pig, 1)[0]);
    const worker = async () => {
      while (remaining.length && artworkRequest === request && focusedStyleWarm === warm) {
        const imageStyle = remaining.shift();
        const node = images.get('focus:' + imageStyle) || warm.images.get(imageStyle) ||
          makeScene(word, 'focus', imageStyle);
        warm.images.set(imageStyle, node);
        await loadScene(node, 'low');
      }
    };
    warm.promise = Promise.all([worker(), worker()]);
    return warm.promise;
  }

  async function prewarmGridStyles(request) {
    if (request.warming || artworkRequest !== request || (window.flashcardAssets && !bundledStyle) ||
        !navigator.onLine || navigator.connection?.saveData) return;
    request.warming = true;
    const start = styles.indexOf(request.style);
    const others = styles.slice(start + 1).concat(styles.slice(0, start));
    for (const imageStyle of others) {
      if (artworkRequest !== request) return;
      const pack = artworkPackFor(request.lesson, imageStyle, 'low');
      if (!pack) continue;
      const controller = new AbortController();
      const {word} = cardScenes.get(request.deck[cardIndex]);
      const [single] = bundledStyle ? [] : cardAssetPaths('assets/scenes/' + imageStyle + '/' + word + '.webp');
      const url = single && assetUrl(single);
      const job = {style: imageStyle, pack, controller};
      speculativeStyle = job;
      const warm = !url || warmUrls.has(url) ? null :
        fetch(url, {cache: 'force-cache', priority: 'low', signal: controller.signal}).then(async (response) => {
          if (!response.ok) return;
          await response.arrayBuffer();
          warmUrls.add(url);
        }).catch(() => {});
      await Promise.all([pack?.done, warm]);
      if (speculativeStyle === job) speculativeStyle = undefined;
    }
  }

  function stopLessonDownloads(lesson) {
    for (const pack of lesson.packs.values()) {
      if (!pack.finished) discardArtworkPack(pack, true);
    }
    for (const card of lesson.deck) {
      for (const node of cardScenes.get(card).images.values()) sceneLoads.get(node)?.cancel();
    }
  }

  function getLessonArtwork(index) {
    if (lessonArtwork.has(index)) return lessonArtwork.get(index);
    const lesson = {index, deck: window.lessons[index][5].map(renderCard), packs: new Map(), urls: new Set()};
    lessonArtwork.set(index, lesson);
    // Keep the visible unit and the three most recent or prepared units.
    if (lessonArtwork.size > 4) {
      const oldest = [...lessonArtwork.values()].find((entry) => entry.index !== lessonIndex);
      stopLessonDownloads(oldest);
      oldest.urls.forEach((url) => URL.revokeObjectURL(url));
      lessonArtwork.delete(oldest.index);
    }
    return lesson;
  }

  function prewarmView(index, mode, selected = 0) {
    const inBundle = hasFullBundle(style);
    if (inBundle && mode === 'grid') return;
    if ((!inBundle && ((window.flashcardAssets && !bundledStyle) || navigator.connection?.saveData ||
        !navigator.onLine)) || !window.lessons[index]) return;
    const lesson = getLessonArtwork(index);
    if (mode === 'grid') {
      const imageStyle = style;
      const pack = artworkPackFor(lesson, imageStyle, 'low');
      if (!pack) return;
      return Promise.all(lesson.deck.map((card, position) => pack.images[position].then((url) => {
        if (!url || pack.controller.signal.aborted || style !== imageStyle) return;
        const node = sceneFor(card, 'grid', imageStyle);
        return loadScene(node, 'low', Promise.resolve(url));
      })));
    }
    const card = lesson.deck[selected];
    return loadCardScene(lesson, card, sceneFor(card, 'focus', style), 'low');
  }

  function prewarmNavigation(request) {
    if (request.navigationWarm || (window.flashcardAssets && !bundledStyle) ||
        (bundledStyle ? request.mode === 'grid' : navigator.connection?.saveData)) return request.navigationWarm;
    // The visible art is ready. Prepare the other view and the adjacent units in the current view.
    const {index} = request.lesson;
    const otherView = request.mode === 'focus' ? 'grid' : 'focus';
    const warm = async () => {
      if (!bundledStyle) await prewarmView(index, otherView, cardIndex);
      for (const target of [index + 1, index - 1]) {
        if (artworkRequest !== request) return;
        await prewarmView(target, request.mode);
      }
      if (bundledStyle && artworkRequest === request) await prewarmView(index, otherView, cardIndex);
    };
    request.navigationWarm = warm();
    return request.navigationWarm;
  }

  function prepareNavigationOnIntent(button, index, mode) {
    const warm = () => {
      const targetIndex = index ?? lessonIndex;
      const targetMode = mode ?? view;
      if (targetIndex !== lessonIndex || targetMode !== view) {
        prewarmView(targetIndex, targetMode, index === undefined ? cardIndex : 0);
      }
    };
    const prepare = (delay) => {
      clearTimeout(navigationIntent);
      if (delay) navigationIntent = setTimeout(warm, delay);
      else warm();
    };
    button.addEventListener('pointerenter', () => prepare(90));
    button.addEventListener('pointerleave', () => clearTimeout(navigationIntent));
    button.addEventListener('focus', () => prepare(90));
    button.addEventListener('pointerdown', () => prepare(0));
  }

  function refreshNavigationArtwork(preview) {
    if (navigationPreview !== preview || preview.refreshPending) return;
    preview.refreshPending = true;
    requestAnimationFrame(() => {
      preview.refreshPending = false;
      if (navigationPreview === preview) artworkRequest?.refreshPreviews?.();
    });
  }

  function loadNavigationPreview() {
    if ((window.flashcardAssets && !bundledStyle) || navigationPreview?.style === style) return;
    const previousPack = navigationPreview?.pack;
    if (previousPack) {
      previousPack.controller.abort();
      previousPack.urls.forEach((url) => URL.revokeObjectURL(url));
    }
    const preview = {style, readable: new Map()};
    navigationPreview = preview;
    const embedded = byId('navigation-preview-data');
    if (embedded) {
      if (!navigationPreviewSources) {
        try { navigationPreviewSources = JSON.parse(embedded.textContent); }
        catch { navigationPreviewSources = {}; }
      }
      const encoded = navigationPreviewSources[style];
      if (encoded) {
        const image = new Image();
        image.onload = () => {
          if (navigationPreview !== preview || image.naturalWidth !== 384 ||
              image.naturalHeight !== previewRows.length * 96) return;
          preview.atlas = image;
          refreshNavigationArtwork(preview);
        };
        image.src = 'data:image/webp;base64,' + encoded;
      }
    }
    if (bundledStyle || navigator.connection?.saveData || !window.fetch || !window.AbortController ||
        !window.TextDecoder || !URL.createObjectURL) return;
    let preloaded = window.navigationReadablePreload;
    delete window.navigationReadablePreload;
    if (preloaded && preloaded.theme !== style) {
      preloaded.controller.abort();
      preloaded = undefined;
    }
    const controller = preloaded?.controller || new AbortController();
    const pack = {controller, format: 'webp', idleTimeout: 6000, urls: [], words: readableKeys};
    pack.resolve = readableKeys.map((key) => (url) => {
      preview.readable.set(key, url);
      refreshNavigationArtwork(preview);
    });
    preview.pack = pack;
    watchPackProgress(pack);
    const response = preloaded?.response || fetch(assetUrl('assets/navigation-readable/' + style + '.bin'), {
      priority: 'low', signal: controller.signal
    });
    response.then((result) => result?.ok && readArtworkPack(result, pack)).catch(() => {})
      .finally(() => clearTimeout(pack.stallTimer));
  }

  function readableScene(card, node) {
    const preview = navigationPreview;
    if (preview?.style !== node.dataset.sceneStyle) return;
    const key = node.dataset.sceneView + ':' + node.dataset.image;
    const url = preview.readable.get(key);
    if (!url) return;
    const scene = cardScenes.get(card);
    if (scene.readable?.src !== url) {
      const image = makeScene(node.dataset.image, node.dataset.sceneView, node.dataset.sceneStyle);
      scene.readable = image;
      image.onload = () => refreshNavigationArtwork(preview);
      image.src = url;
    }
    if (scene.readable.complete && scene.readable.naturalWidth) return scene.readable;
  }

  function previewScene(card, node) {
    if (!navigationPreview?.atlas || navigationPreview.style !== node.dataset.sceneStyle) return;
    const index = previewWordIndexes.get(node.dataset.image);
    if (index === undefined) return;
    const scene = cardScenes.get(card);
    const portrait = node.dataset.sceneView === 'focus';
    const tile = 48;
    const key = node.dataset.sceneView + ':' + navigationPreview.style;
    if (scene.previewKey === key) return scene.preview;
    const canvas = scene.preview || make('canvas', 'scene-art');
    const context = canvas.getContext('2d');
    if (!context) return;
    canvas.width = portrait ? tile * 3 / 4 : tile;
    canvas.height = portrait ? tile : tile * 3 / 4;
    const row = Math.floor(index / 8) + (portrait ? previewRows.length : 0);
    context.drawImage(navigationPreview.atlas, index % 8 * tile, row * tile, canvas.width, canvas.height,
      0, 0, canvas.width, canvas.height);
    canvas.dataset.sceneView = node.dataset.sceneView;
    canvas.dataset.sceneStyle = node.dataset.sceneStyle;
    scene.preview = canvas;
    scene.previewKey = key;
    return canvas;
  }

  function visibleArt() {
    const focused = view === 'focus';
    const deck = Array.from(cards.children);
    deck.forEach((card, index) => {
      const current = index === cardIndex;
      card.tabIndex = !focused || current ? 0 : -1;
      if (focused && !current) card.setAttribute('aria-hidden', 'true');
      else card.removeAttribute('aria-hidden');
    });
    if (!deck.length) return;
    if (artworkRequest?.first === deck[0] && artworkRequest.mode === view && artworkRequest.style === style) {
      if (focused) artworkRequest.promote(cardIndex);
      else loadCardScene(artworkRequest.lesson, deck[cardIndex], sceneFor(deck[cardIndex], 'focus', style), 'low');
      return;
    }
    stopSpeculation(focused ? undefined : style);
    if (!focused) releaseFocusedStyles(true);
    if (focusedStyleWarm?.card === deck[cardIndex]) {
      for (const [imageStyle, node] of focusedStyleWarm.images) {
        if (imageStyle !== style && !decodedScenes.has(node)) sceneLoads.get(node)?.cancel();
      }
    }
    const images = deck.map((card) => sceneFor(card, view, style));
    const previous = artworkRequest;
    const request = {first: deck[0], style, mode: view, images, deck, lesson: getLessonArtwork(lessonIndex)};
    const switchingPortrait = Boolean(bundledStyle && focused && previous && previous.style !== style);
    artworkRequest = request;
    if (previous && (previous.first !== request.first || previous.style !== style)) {
      const newLesson = previous.first !== request.first;
      for (const pack of previous.lesson.packs.values()) {
        if (pack.imageStyle === previous.style && !pack.finished) discardArtworkPack(pack, true);
      }
      for (const card of previous.deck) {
        for (const node of cardScenes.get(card).images.values()) {
          if (newLesson || (node.dataset.sceneStyle !== style && !returnPreloads.has(node))) {
            sceneLoads.get(node)?.cancel();
          }
        }
      }
    } else if (focused && previous?.mode === 'grid') {
      previous.images.forEach((node) => sceneLoads.get(node)?.cancel());
    } else if (!focused && previous?.mode === 'focus') {
      // The grid is visible now. Keep nearby single cards warm without competing for every card.
      previous.images.forEach((node, index) => {
        if (Math.abs(index - cardIndex) > 1) sceneLoads.get(node)?.cancel();
      });
    }
    const order = deck.map((_, index) => index);

    function showScene(index) {
      const card = deck[index];
      const {art} = cardScenes.get(card);
      const next = images[index];
      if (decodedScenes.has(next)) {
        card.classList.toggle('portrait-art', next.naturalHeight > next.naturalWidth);
        if (art.firstElementChild !== next) art.replaceChildren(next);
        delete card.dataset.imageState;
        return;
      }
      const displayed = art.firstElementChild;
      const nearby = !focused || Math.abs(index - cardIndex) <= 1;
      const readable = nearby && readableScene(card, next);
      if (readable) {
        if (displayed !== readable) art.replaceChildren(readable);
        card.dataset.imageState = 'readable';
        return;
      }
      const failed = ['error', 'preview-only'].includes(card.dataset.imageState);
      const preview = nearby && previewScene(card, next);
      if (preview) {
        if (displayed !== preview) art.replaceChildren(preview);
        card.dataset.imageState = failed ? 'preview-only' : 'switching';
        return;
      }
      // A grid card can keep its landscape image while the new style loads.
      if (!focused && displayed?.dataset.sceneView === 'grid' &&
          (decodedScenes.has(displayed) || (displayed.naturalWidth && displayed.complete))) {
        card.dataset.imageState = 'switching';
        return;
      }
      if (art.firstElementChild !== next) art.replaceChildren(next);
      card.dataset.imageState = failed ? 'error' : 'loading';
    }

    // When the grid is already available at mobile viewing size, give quick switches
    // a chance to finish before asking the network for every original image.
    const preview = navigationPreview;
    const waitForGridDetails = !focused && preview?.style === request.style && deck.every((card) =>
      preview.readable.has('grid:' + cardScenes.get(card).word)) ? new Promise((resolve) => setTimeout(resolve, 180)) : null;
    const loadVisible = async (index, priority, directPortrait = false) => {
      if (waitForGridDetails) await waitForGridDetails;
      if (artworkRequest !== request) return;
      const ready = await loadCardScene(request.lesson, deck[index], images[index], priority, directPortrait);
      if (artworkRequest !== request) return;
      if (ready) showScene(index);
      else if (deck[index].dataset.imageState && deck[index].dataset.imageState !== 'readable') {
        const scene = cardScenes.get(deck[index]);
        const displayed = scene.art.firstElementChild;
        if (displayed === scene.preview) deck[index].dataset.imageState = 'preview-only';
        else if (deck[index].dataset.imageState !== 'switching') deck[index].dataset.imageState = 'error';
      }
    };
    request.refreshPreviews = () => order.forEach((index) => {
      if (['loading', 'switching', 'preview-only', 'error'].includes(deck[index].dataset.imageState)) showScene(index);
    });
    order.forEach(showScene);
    if (focused) {
      request.promote = async (index, directPortrait) => {
        showScene(index);
        const selected = loadVisible(index, 'high', directPortrait);
        const inBundle = request.style === bundledStyle;
        const warmNeighbors = () => {
          if (artworkRequest !== request || cardIndex !== index) return;
          if (index > 0) loadVisible(index - 1, 'low');
          if (index + 1 < deck.length) loadVisible(index + 1, 'low');
        };
        if (inBundle || (bundledStyle && !navigator.connection?.saveData)) warmNeighbors();
        await selected;
        if (artworkRequest !== request || cardIndex !== index) return;
        if (!request.ready) {
          request.ready = true;
          prepareFullBundle();
          prepareStylePortraits(request.style);
          setTimeout(() => {
            if (artworkRequest === request) updateDecorativeArt();
          }, 180);
        }
        Promise.resolve(prewarmNavigation(request)).then(() => {
          if (cardIndex === index) prewarmFocusedStyles(request);
        });
        // Keep nearby cards ready for swipes. Grid packs are loaded in grid view.
        if (!bundledStyle && !navigator.connection?.saveData) setTimeout(warmNeighbors, 180);
      };
      request.promote(cardIndex, switchingPortrait);
      return;
    }

    const nearSelection = [...order].sort((a, b) => Math.abs(a - cardIndex) - Math.abs(b - cardIndex));
    const warmFocusCard = (index, keepOnStyleChange = false) => {
      const node = sceneFor(deck[index], 'focus', request.style);
      if (!keepOnStyleChange) loadCardScene(request.lesson, deck[index], node, 'low');
      else {
        // Keep just the selected card warm for returning to single view.
        returnPreloads.add(node);
        loadCardScene(request.lesson, deck[index], node, 'low').then(() => returnPreloads.delete(node));
      }
    };
    const early = order.slice(0, 2).map((index) => loadVisible(index, 'high'));
    const remaining = order.slice(2).map((index) => loadVisible(index, 'auto'));
    if (!bundledStyle) early[0].then(() => {
      if (artworkRequest === request) warmFocusCard(cardIndex, true);
    });
    Promise.all([...early, ...remaining]).then(() => {
      if (artworkRequest !== request) return;
      request.ready = true;
      prepareFullBundle();
      if (bundledStyle && !navigator.connection?.saveData) warmFocusCard(cardIndex, true);
      prewarmNavigation(request);
      // Let the selected style finish rendering before warming offscreen artwork.
      setTimeout(() => {
        if (artworkRequest !== request) return;
        if (!bundledStyle || !navigator.connection?.saveData) {
          nearSelection.slice(1, 3).forEach((index) => warmFocusCard(index));
        }
        updateDecorativeArt();
      }, 180);
    });
  }

  function updateCardNav() {
    cardNav.hidden = view !== 'focus';
    previousCard.disabled = cardIndex === 0;
    nextCard.disabled = cardIndex + 1 >= cards.children.length;
    byId('card-position').textContent = (cardIndex + 1) + ' / ' + cards.children.length;
  }

  function cardOffset(index) {
    if (index === 0) return 0;
    return cards.children[index].offsetLeft - cards.firstElementChild.offsetLeft;
  }

  function setCard(index) {
    if (cardIndex === index) return;
    const shouldKeepFocus = cards.children[cardIndex] === document.activeElement;
    stop();
    releaseFocusedStyles();
    cardIndex = index;
    visibleArt();
    updateCardNav();
    if (shouldKeepFocus && view === 'focus') cards.children[index].focus({preventScroll: true});
    saveSettings();
  }

  function alignCard(smooth = false) {
    if (view !== 'focus') return;
    cards.scrollTo({left: cardOffset(cardIndex), behavior: smooth && !reducedMotion.matches ? 'smooth' : 'auto'});
  }

  function moveCard(offset) {
    const index = cardIndex + offset;
    if (!cards.children[index]) return;
    setCard(index);
    alignCard(!bundledStyle);
  }

  function renderView() {
    clearTimeout(scrollTimer);
    cancelAnimationFrame(scrollFrame);
    scrollFrame = undefined;
    const singleCard = view === 'focus';
    const wasSingleCard = cards.classList.contains('focus');
    if (!singleCard && wasSingleCard) focusWasScrolled = cards.scrollLeft !== 0;
    const needsAlignment = singleCard && (cardIndex !== 0 || wasSingleCard || focusWasScrolled);
    learn.classList.toggle('single-card', singleCard);
    stage.classList.toggle('focus-stage', singleCard);
    cards.classList.toggle('focus', singleCard);
    cards.classList.toggle('portrait-cards', singleCard && portraitLayout);
    visibleArt();
    updateCardNav();
    updateSettings();
    if (needsAlignment) alignCard();
  }

  function chooseLesson(index, start = 0) {
    stop();
    releaseFocusedStyles();
    stopSpeculation();
    clearTimeout(navigationIntent);
    for (const lesson of lessonArtwork.values()) {
      if (lesson.index !== index) stopLessonDownloads(lesson);
    }
    lessonIndex = index;
    const artwork = getLessonArtwork(index);
    lessonArtwork.delete(index);
    lessonArtwork.set(index, artwork);
    const [label, title, english, page, icon, words] = window.lessons[lessonIndex];
    learn.classList.toggle('counting-lesson', icon === 'numbers');
    cardIndex = Number.isInteger(start) && words[start] ? start : 0;
    byId('lesson-number').textContent = label;
    byId('lesson-title').textContent = title;
    byId('lesson-english').textContent = english;
    byId('lesson-count').textContent = words.length + ' 张卡片';
    byId('textbook-link').href = 'https://zhiquai.github.io/shanghai-english-reader/#' + page;
    byId('previous').disabled = index === 0;
    byId('next').disabled = index === window.lessons.length - 1;
    lessonPicker.open = false;
    currentLessonName.textContent = label + ' · ' + title;
    if (currentLessonArt.dataset.image !== icon) {
      currentLessonArt.dataset.image = icon;
      delete currentLessonArt.dataset.appliedStyle;
    }
    for (const list of [tabs, lessonOptions]) {
      Array.from(list.children).forEach((tab, i) => {
        if (i === index) tab.setAttribute('aria-current', 'true');
        else tab.removeAttribute('aria-current');
      });
    }
    if (cards.firstElementChild !== artwork.deck[0]) cards.replaceChildren(...artwork.deck);
    renderView();
    loadNavigationPreview();
    saveSettings();
  }

  function lessonButton([label, title, , , icon], index, mobile = false) {
    const button = make('button', 'unit');
    button.type = 'button';
    const thumbnail = image(icon, 'unit-icon');
    thumbnail.loading = 'lazy';
    button.append(thumbnail, make('span', 'unit-name', title), make('span', 'unit-tag', label));
    prepareNavigationOnIntent(button, index);
    button.addEventListener('click', () => {
      chooseLesson(index);
      if (mobile) lessonPickerSummary.focus({preventScroll: true});
    });
    return button;
  }

  window.lessons.forEach((lesson, index) => {
    tabs.appendChild(lessonButton(lesson, index));
    lessonOptions.appendChild(lessonButton(lesson, index, true));
  });

  document.addEventListener('click', (event) => {
    if (lessonPicker.open && !lessonPicker.contains(event.target)) lessonPicker.open = false;
  });
  lessonPicker.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape' || !lessonPicker.open) return;
    event.preventDefault();
    lessonPicker.open = false;
    lessonPickerSummary.focus({preventScroll: true});
  });
  styleSelect.addEventListener('change', () => {
    if (style === styleSelect.value || !styles.includes(styleSelect.value)) return;
    style = styleSelect.value;
    if (bundledStyle && window.location.protocol !== 'file:') {
      const url = new URL(window.location.href);
      if (style === bundledStyle) url.searchParams.delete('style');
      else url.searchParams.set('style', style);
      window.history.replaceState(null, '', url);
    }
    loadNavigationPreview();
    visibleArt();
    updateSettings();
    saveSettings();
  });
  styleSelect.addEventListener('pointerdown', () => {
    if (artworkRequest?.ready) {
      if (view === 'focus') prewarmFocusedStyles(artworkRequest);
      else prewarmGridStyles(artworkRequest);
    }
  });
  buttons.filter((button) => button.dataset.view).forEach((button) => {
    prepareNavigationOnIntent(button, undefined, button.dataset.view);
  });
  buttons.forEach((button) => button.addEventListener('click', () => {
    if (button.dataset.accent && button.dataset.accent !== accent) {
      stop();
      accent = button.dataset.accent;
    }
    if (button.dataset.view && button.dataset.view !== view) {
      view = button.dataset.view;
      renderView();
    } else {
      updateSettings();
    }
    saveSettings();
  }));

  function syncCardToScroll() {
    if (view !== 'focus') return;
    const {scrollLeft} = cards;
    let nearest = 0;
    let distance = Math.abs(scrollLeft - cardOffset(nearest));
    for (let index = 1; index < cards.children.length; index += 1) {
      const nextDistance = Math.abs(scrollLeft - cardOffset(index));
      if (nextDistance < distance) {
        nearest = index;
        distance = nextDistance;
      }
    }
    setCard(nearest);
  }
  cards.addEventListener('scroll', () => {
    if (view !== 'focus') return;
    if (bundledStyle) {
      if (scrollFrame === undefined) scrollFrame = requestAnimationFrame(() => {
        scrollFrame = undefined;
        syncCardToScroll();
      });
      return;
    }
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(syncCardToScroll, 100);
  }, {passive: true});
  cards.addEventListener('scrollend', () => {
    clearTimeout(scrollTimer);
    syncCardToScroll();
  });
  previousCard.addEventListener('click', () => moveCard(-1));
  nextCard.addEventListener('click', () => moveCard(1));
  cards.addEventListener('keydown', (event) => {
    if (view !== 'focus' || !['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    moveCard(event.key === 'ArrowRight' ? 1 : -1);
  });
  window.addEventListener('resize', () => alignCard());
  window.addEventListener('online', () => {
    if (view === 'focus' && ['error', 'preview-only'].includes(cards.children[cardIndex]?.dataset.imageState)) {
      artworkRequest?.promote(cardIndex);
    } else if (view === 'grid' && artworkRequest?.deck.some((card) => card.dataset.imageState)) {
      artworkRequest = undefined;
      visibleArt();
    }
  });

  const recall = byId('recall');
  recall.addEventListener('click', () => {
    hidden = !hidden;
    cards.classList.toggle('masked', hidden);
    recall.setAttribute('aria-pressed', String(hidden));
    recall.textContent = hidden ? '显示中文' : '隐藏中文';
  });

  function move(offset) {
    chooseLesson(lessonIndex + offset);
    byId('lesson-title').scrollIntoView({block: 'start'});
  }
  byId('previous').addEventListener('click', () => move(-1));
  byId('next').addEventListener('click', () => move(1));
  async function loadFirstLesson() {
    loadNavigationPreview();
    if (!window.flashcardAssets) {
      const probe = new Image();
      probe.src = 'data:image/avif;base64,AAAAHGZ0eXBhdmlmAAAAAG1pZjFhdmlmbWlhZgAAANZtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABwaWN0AAAAAAAAAAAAAAAAAAAAACJpbG9jAAAAAERAAAEAAQAAAAAA+gABAAAAAAAAAB0AAAAjaWluZgAAAAAAAQAAABVpbmZlAgAAAAABAABhdjAxAAAAAA5waXRtAAAAAAABAAAAVmlwcnAAAAA4aXBjbwAAAAxhdjFDgSACAAAAABRpc3BlAAAAAAAAAAIAAAACAAAAEHBpeGkAAAAAAwgICAAAABZpcG1hAAAAAAAAAAEAAQOBAgMAAAAlbWRhdBIACgc4ADaQENBpMhAZQmMEwAA0AACQQMkcYIpq';
      try {
        await probe.decode();
        compactCards = probe.naturalWidth === 2;
      } catch { /* Use WebP when the browser cannot decode AVIF. */ }
    }
    if (bundledStyle) {
      byId('fast-loading')?.remove();
      document.body.classList.remove('fast-loading');
    }
    chooseLesson(lessonIndex, requestedLesson >= 0 ? 0 : saved.card);
  }
  loadFirstLesson();
})();

</script>
<script>
  if (new URLSearchParams(location.search).has('trace')) {
    const script = document.createElement('script');
    script.src = 'fast/trace.js?v=2';
    document.body.append(script);
  }
</script>
